name: Release dry run

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package location
        required: true
        default: packages/css-color-parser
        type: string
      release-mode:
        description: Release version mode
        required: true
        default: bump
        type: choice
        options:
          - bump
          - exact
          - current
      release-bump:
        description: Release bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Exact SemVer (used when mode is exact)
        required: false
        default: ""
        type: string

jobs:
  release-dry-run:
    uses: moyarich/dev-toolkit/.github/workflows/npm-release-dry-run.yml@main
    with:
      package-directory: ${{ inputs.package-directory }}
      release-mode: ${{ inputs.release-mode }}
      release-bump: ${{ inputs.release-bump }}
      exact-version: ${{ inputs.exact-version }}
      node-version: "22"

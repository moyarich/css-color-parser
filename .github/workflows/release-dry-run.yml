name: Release dry run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from package.json
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release.yml@v0
    with:
      version: ${{ inputs.version }}
      release-tag: packages/css-color-parser@${{ inputs.version }}
      release-name: "@moyarich/css-color-parser v${{ inputs.version }}"
      changelog-file: packages/css-color-parser/CHANGELOG.md
      target-ref: main
      dry-run: true
      create-tag: true
      draft: false

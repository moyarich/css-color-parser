name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: moyarich/actions/.github/workflows/reusable_node-ci.yml@c37643656679bec74b2702fc61bf043fe23c0aa7
    with:
      node-version: "24"
    secrets:
      package-token: ${{ secrets._GITHUB_TOKEN }}

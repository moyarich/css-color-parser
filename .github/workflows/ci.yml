name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: moyarich/actions/.github/workflows/reusable_node-ci.yml@cce382acd3702ffd93cfb28c10f5489070eb971f
    with:
      node-version: "24"
    secrets:
      package-token: ${{ secrets._GITHUB_TOKEN }}

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_node-ci.yml@v0
    with:
      node-version: "24"
    secrets:
      package-token: ${{ secrets._GITHUB_TOKEN }}

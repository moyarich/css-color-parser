name: CI / CLI and workspace quality
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci_cli.yml"
      - "src/**"
      - "packages/**"
      - "apps/**"
      - "tests/**"
      - "**/*.{ts,tsx,js,jsx,mjs,cjs}"
      - "**/{vite,vitest,eslint,tsconfig}*.{js,mjs,cjs,ts,json}"
      - "package*.json"
      - ".npmrc"
  pull_request:
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout-sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - run: npm ci --include=optional --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm run typecheck
      - run: npm test --workspaces --if-present --include-workspace-root

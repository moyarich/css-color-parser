name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: moyarich/actions/.github/workflows/reusable_github-pages.yml@d28dc4fae24cb84b5e9acea2ac1f8cde5f95297e
    with:
      node-version: "24"
      build-command: npm run build:playground -- --base=/css-color-parser/
      output-directory: apps/playground/dist
    secrets: inherit

name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: moyarich/actions/.github/workflows/reusable_github-pages.yml@c37643656679bec74b2702fc61bf043fe23c0aa7
    with:
      node-version: "24"
      build-command: npm run build:playground -- --base=/css-color-parser/
      output-directory: apps/playground/dist
    secrets: inherit

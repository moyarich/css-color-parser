name: Deploy playground to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: moyarich/dev-toolkit/.github/workflows/github-pages.yml@main
    with:
      node-version: "22"
      build-command: npm run build:playground -- --base=/css-color-parser/
      output-directory: apps/playground/dist
    secrets: inherit

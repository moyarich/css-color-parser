name: Release package

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package location
        required: true
        default: packages/css-color-parser
        type: string
      release-mode:
        description: Release version mode
        required: true
        default: bump
        type: choice
        options:
          - bump
          - exact
          - current
      release-bump:
        description: Release bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Exact SemVer (used when mode is exact)
        required: false
        default: ""
        type: string
      auto-publish:
        description: Publish after release
        required: true
        default: false
        type: boolean
      registry:
        description: Package registry
        required: true
        type: choice
        options:
          - github
          - npm
          - both
        default: github
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string

jobs:
  release:
    uses: moyarich/dev-toolkit/.github/workflows/npm-release.yml@main
    with:
      package-directory: ${{ inputs.package-directory }}
      release-mode: ${{ inputs.release-mode }}
      release-bump: ${{ inputs.release-bump }}
      exact-version: ${{ inputs.exact-version }}
      auto-publish: ${{ inputs.auto-publish }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      node-version: "22"
    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
      npm-token: ${{ secrets._NPM_TOKEN }}

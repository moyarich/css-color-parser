name: Publish package

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package location
        required: true
        default: packages/css-color-parser
        type: string
      version:
        description: Exact version to publish; empty uses package.json
        required: false
        default: ""
        type: string
      registry:
        description: Package registry
        required: true
        type: choice
        options:
          - github
          - npm
        default: github
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string

jobs:
  publish:
    uses: moyarich/dev-toolkit/.github/workflows/npm-publish.yml@main
    with:
      package-directory: ${{ inputs.package-directory }}
      version: ${{ inputs.version }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      node-version: "22"
    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
      npm-token: ${{ secrets._NPM_TOKEN }}

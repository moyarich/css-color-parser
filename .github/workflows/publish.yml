name: Publish package

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package location
        required: true
        default: packages/css-color-parser
        type: string
      version:
        description: Exact version to publish; empty uses package.json
        required: false
        default: ""
        type: string
      registry:
        description: Package registry
        required: true
        type: choice
        options: [github, npm]
        default: github
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      package-directory: ${{ inputs.package-directory }}
      version-mode: ${{ inputs.version != '' && 'exact' || 'package-json' }}
      exact-version: ${{ inputs.version }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      dry-run: false
      node-version: "24"
    secrets:
      npm-token: ${{ secrets._NPM_TOKEN }}

name: Publish package

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Publishable package directory
        required: true
        default: packages/css-color-parser
        type: string
      registry:
        description: Package registry
        required: true
        type: choice
        options:
          - github
          - npm
          - all
        default: github
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string
      dry-run:
        description: Validate and preview without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@v0
    with:
      package-directory: ${{ inputs.package-directory }}
      target-branch: main
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      version-mode: package-json
      verify-git-tag: true
      dry-run: ${{ inputs.dry-run }}
      node-version: "24"
    secrets:
      npm-token: ${{ secrets._NPM_TOKEN }}

name: Refresh dependency lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - chore/update-dependencies

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/update-dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets._GITHUB_TOKEN }}
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:chore/update-dependencies
